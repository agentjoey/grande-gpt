name: macOS Seatbelt

on:
  pull_request:
    paths:
      - ".github/workflows/macos-seatbelt.yml"
      - "src/sandbox.ts"
      - "src/sbpl.ts"
      - "src/dependencyBootstrap.ts"
      - "src/packageManagerIdentity.ts"
      - "src/layout.ts"
      - "tests/sandbox.test.ts"
      - "tests/dependencyBootstrap.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos-seatbelt.yml"
      - "src/sandbox.ts"
      - "src/sbpl.ts"
      - "src/dependencyBootstrap.ts"
      - "src/packageManagerIdentity.ts"
      - "src/layout.ts"
      - "tests/sandbox.test.ts"
      - "tests/dependencyBootstrap.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seatbelt-dns:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/sandbox.test.ts tests/dependencyBootstrap.test.ts
